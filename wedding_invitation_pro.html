<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080706">
<title>Mahmoud & N — Wedding Invitation</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap');

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#080706}
body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px 14px 34px;
  font-family:'Cormorant Garamond',Georgia,serif;
  overflow-x:hidden;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 25%,rgba(183,145,86,.10),transparent 35%),
    radial-gradient(circle at 50% 85%,rgba(183,145,86,.07),transparent 32%);
}
.card{
  position:relative;
  width:min(680px,100%);
  padding:10px;
  border:1px solid rgba(198,158,99,.35);
  background:linear-gradient(145deg,rgba(210,174,117,.10),rgba(0,0,0,.15));
  box-shadow:0 24px 70px rgba(0,0,0,.65),0 0 40px rgba(190,145,80,.08);
  animation:appear .9s ease both;
}
.card:before,.card:after{
  content:"";
  position:absolute;
  width:45px;height:45px;
  border-color:rgba(214,175,111,.55);
  pointer-events:none;
}
.card:before{top:-1px;left:-1px;border-top:1px solid;border-left:1px solid}
.card:after{right:-1px;bottom:-1px;border-right:1px solid;border-bottom:1px solid}
.photo-wrap{position:relative;overflow:hidden;background:#000}
.photo-wrap:after{
  content:"";
  position:absolute;inset:0;
  pointer-events:none;
  box-shadow:inset 0 0 45px rgba(0,0,0,.30);
}
.invitation{display:block;width:100%;height:auto}
.location-wrap{padding:22px 0 12px;text-align:center}
.location{
  position:relative;
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:11px 25px;
  color:#e1bd82;
  text-decoration:none;
  font-size:20px;
  letter-spacing:2.5px;
  border:1px solid rgba(211,171,107,.55);
  background:linear-gradient(180deg,rgba(190,145,80,.12),rgba(190,145,80,.03));
  box-shadow:0 8px 25px rgba(0,0,0,.35);
  transition:all .25s ease;
}
.location:before{content:"⌖";font-family:Arial,sans-serif;font-size:22px}
.location:hover{transform:translateY(-2px);border-color:#e1bd82;box-shadow:0 10px 30px rgba(190,145,80,.18)}
.location:active{transform:scale(.97)}
@keyframes appear{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(max-width:520px){
  body{padding:0 0 24px}
  .card{border-left:0;border-right:0;padding:7px}
  .location{font-size:18px;padding:10px 22px}
}
</style>
</head>
