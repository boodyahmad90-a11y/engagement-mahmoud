<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دعوة زفاف محمود و N</title>
  <meta name="description" content="دعوة زفاف محمود و N - 8/10">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #090807;
      font-family: Arial, Tahoma, sans-serif;
    }
    body {
      display: flex;
      justify-content: center;
      padding: 18px 12px 28px;
    }
    .page {
      width: min(100%, 720px);
      text-align: center;
    }
    .card {
      width: 100%;
      display: block;
      border-radius: 8px;
      box-shadow: 0 18px 55px rgba(0,0,0,.55);
    }
    .location {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 18px auto 0;
      padding: 14px 24px;
      border-radius: 999px;
      background: linear-gradient(135deg, #c99b5a, #e0bd83);
      color: #17120d;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(201,155,90,.22);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .location:hover {
      transform: translateY(-2px);
      box-shadow: 0 11px 28px rgba(201,155,90,.3);
    }
    .hint {
      margin: 10px 0 0;
      color: #cdbb9d;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="page">
    <img class="card" src="invitation.jpg" alt="دعوة زفاف محمود و N">
    <a class="location"
       href="https://maps.app.goo.gl/mwshkHBLPn34pMj3A"
       target="_blank"
       rel="noopener noreferrer">
      📍 فتح اللوكيشن على Google Maps
    </a>
    <p class="hint">اضغط على الزر لفتح موقع القاعة</p>
  </main>
</body>
</html>
